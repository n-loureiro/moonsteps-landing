<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sällskapsresan · Family Trivia</title>
<meta name="theme-color" content="#f3e4c0">
<link rel="icon" href="stig-helmer.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600&family=Barlow:wght@400;500;600&family=Shrikhand&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f3e4c0;--sand-2:#e9d4a4;--ink:#2a1f14;--muted:#6f5d45;--red:#d7261e;--red-dark:#a91a14;
  --navy:#173a5e;--navy-2:#0f2a46;--gold:#e7bd5d;--paper:#fffdf8;
  --c-blue:#2f86d1;--c-pink:#d6247c;--c-yellow:#f2be12;--c-purple:#7c3fa3;--c-green:#3aa648;--c-orange:#f0841a;
  --ease:cubic-bezier(.2,.75,.25,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:var(--sand);
  background-image:radial-gradient(circle at 20% 0%,#f8edd2 0,transparent 55%),radial-gradient(circle at 100% 100%,#ecd6a6 0,transparent 50%);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
.wordmark{font-family:Shrikhand,cursive;color:var(--red);font-weight:400;letter-spacing:.01em;line-height:1}
[hidden]{display:none!important}

/* ---------- Home ---------- */
.home{min-height:100vh;display:grid;place-items:center;padding:32px 20px;text-align:center;overflow:hidden}
.home-inner{display:grid;justify-items:center;gap:26px;max-width:720px}
.sun{position:relative;width:min(300px,64vw);aspect-ratio:1;margin-bottom:-64px}
.sun::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(#f9c74f 0 30%,#f8961e 30% 52%,#f3722c 52% 70%,#d7261e 70% 100%);
  -webkit-mask:linear-gradient(#000 0 30%,transparent 30% 33%,#000 33% 52%,transparent 52% 56%,#000 56% 70%,transparent 70% 75%,#000 75%);
          mask:linear-gradient(#000 0 30%,transparent 30% 33%,#000 33% 52%,transparent 52% 56%,#000 56% 70%,transparent 70% 75%,#000 75%);
  opacity:.9}
.fan{position:absolute;left:50%;bottom:-6px;width:118px;height:165px;transform:translateX(-50%)}
.fan .card-back{position:absolute;inset:0;width:118px;box-shadow:0 10px 24px rgba(60,30,0,.28)}
.fan .card-back:nth-child(1){transform:rotate(-16deg) translate(-38px,6px)}
.fan .card-back:nth-child(2){transform:rotate(14deg) translate(38px,6px)}
.fan .card-back:nth-child(3){transform:translateY(-8px)}
.home h1{font-size:clamp(46px,11vw,96px);margin:58px 0 0;text-shadow:3px 3px 0 #f8d98e}
.tagline{margin:-10px 0 0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(16px,3.6vw,21px);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.play{
  border:0;border-radius:999px;background:var(--red);color:#fff;padding:18px 34px 17px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(20px,4.4vw,26px);letter-spacing:.04em;
  box-shadow:0 6px 0 var(--red-dark),0 14px 26px rgba(150,20,10,.3);transition:transform .15s var(--ease),box-shadow .15s var(--ease)
}
.play:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--red-dark),0 18px 30px rgba(150,20,10,.32)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark),0 8px 16px rgba(150,20,10,.25)}
.play:focus-visible,.ghost-btn:focus-visible,.flip:focus-visible{outline:3px solid var(--navy);outline-offset:4px}
.films{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;margin:6px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.films li{display:flex;align-items:center;gap:6px}
.tri{display:inline-block;width:12px;height:14px;clip-path:polygon(0 0,100% 50%,0 100%);background:var(--c)}

/* ---------- Card back ---------- */
.card-back{
  display:block;width:100%;aspect-ratio:5/7;border-radius:12px;background:var(--paper);padding:7px;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 16px rgba(70,40,0,.18);position:relative;overflow:hidden;container-type:inline-size
}
.card-back .art{display:block;width:100%;height:76%;object-fit:cover;object-position:50% 18%;border-radius:7px 7px 2px 2px;background:#dcc48e}
.card-back .label{display:grid;place-items:center;height:24%;padding:0 4px}
.card-back .label span{font-size:11.5cqw;white-space:nowrap}
.card-back::after{content:"";position:absolute;inset:3px;border:1.5px solid rgba(215,38,30,.35);border-radius:10px;pointer-events:none}

/* ---------- Deck ---------- */
.deck-screen{max-width:1100px;margin:0 auto;padding:68px 20px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topbar .wordmark{font-size:clamp(28px,5vw,40px);background:none;border:0;padding:0}
.status{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ghost-btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.05em;font-size:16px;transition:background .15s,color .15s}
.ghost-btn:hover{background:var(--ink);color:var(--sand)}
.hint{margin:0 auto 10px;max-width:560px;text-align:center;color:var(--muted);font-size:15px}
.table{display:flex;justify-content:center;align-items:flex-start;gap:clamp(28px,9vw,110px);margin:34px 0 10px}
.pile{display:grid;justify-items:center;gap:22px}
.pile-slot{position:relative;display:block;width:clamp(138px,30vw,250px);aspect-ratio:5/7;border:0;background:none;padding:0;border-radius:12px}
.pile-slot:focus-visible{outline:3px solid var(--navy);outline-offset:8px}
.pile-slot .card-back{position:absolute;inset:0;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 2px rgba(70,40,0,.25)}
.stack .card-back{transform:translate(calc(var(--k) * .6px),calc(var(--k) * 2.6px))}
.stack .card-back.bottom{box-shadow:0 14px 26px rgba(70,40,0,.28),0 2px 3px rgba(70,40,0,.2)}
.stack .card-back.top{transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.stack:hover .card-back.top,.stack:focus-visible .card-back.top{transform:translate(-4px,-14px) rotate(-3deg);box-shadow:0 18px 30px rgba(70,40,0,.3)}
.stack:active .card-back.top{transform:translate(-2px,-6px) rotate(-1.5deg)}
.stack .card-back.lifting{visibility:hidden}
.discard .card-back{transform:translate(var(--x),var(--y)) rotate(var(--rot))}
.discard .card-back:last-child{box-shadow:0 10px 22px rgba(70,40,0,.25)}
.discard:not(:disabled):hover .card-back:last-child{transform:translate(var(--x),calc(var(--y) - 8px)) rotate(var(--rot))}
.discard:disabled{cursor:default}
.empty-slot{position:absolute;inset:0;display:grid;place-items:center;padding:14px;border:3px dashed rgba(42,31,20,.22);border-radius:12px;
  text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;color:var(--muted)}
.pile-label{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px;color:var(--muted)}
.pile-label strong{color:var(--ink);font-size:20px;letter-spacing:.02em;margin-right:4px}
@media (max-width:420px){.table{gap:22px}.pile-slot{width:40vw}}
.done-banner{margin-top:28px;text-align:center;display:grid;justify-items:center;gap:12px}
.done-banner p{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600}

/* ---------- Stage / question card ---------- */
.stage{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:64px 20px 20px;overflow:auto;
  background:rgba(25,18,10,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.stage.closing{animation:fadeout .25s ease forwards}
@keyframes fadeout{to{opacity:0}}
.stage-inner{display:grid;justify-items:center;gap:16px;width:min(780px,100%);margin:auto}
.flip{width:100%;perspective:1800px;border:0;background:none;padding:0;text-align:left;cursor:pointer;border-radius:18px}
.flip-inner{display:grid;transform-style:preserve-3d;transition:transform .75s var(--ease)}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.answers{transform:rotateY(180deg)}
.qcard{
  display:grid;grid-template-columns:70px 1fr;border-radius:18px;padding:12px 12px 12px 0;min-height:100%;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.07) 0 1px,transparent 1.5px) 0 0/7px 7px,
    radial-gradient(circle at 60% 40%,rgba(0,0,0,.18) 0 1px,transparent 1.5px) 0 0/5px 5px,
    linear-gradient(160deg,var(--navy),var(--navy-2));
  box-shadow:0 30px 60px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06) inset
}
.strip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px 0}
.strip .wordmark{writing-mode:vertical-rl;transform:rotate(180deg);font-size:30px;
  background:linear-gradient(180deg,#f6dc95,var(--gold) 45%,#b98a2c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.strip .mini{display:grid;gap:3px}
.strip .mini i{display:block;width:9px;height:10px;clip-path:polygon(0 0,100% 50%,0 100%);background:var(--c)}
.strip .side{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);writing-mode:vertical-rl;transform:rotate(180deg)}
.panel{background:var(--paper);border-radius:12px;padding:14px 18px 12px 12px;display:grid;gap:4px;position:relative}
.row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #efe6d6}
.row:last-of-type{border-bottom:0}
.wedge{width:34px;height:36px;clip-path:polygon(0 0,100% 50%,0 100%);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000));justify-self:center}
.txt{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(16px,2.3vw,19px);line-height:1.18}
.answers .txt{font-weight:700;font-size:clamp(17px,2.5vw,21px)}
.meta{display:block;margin-top:3px;font-family:Barlow,sans-serif;font-weight:500;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#8d7b62}
.lvl{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:#f1e7d3;color:#6a563a;letter-spacing:.06em}
.lvl.Hard{background:#fbe0cf;color:#9a3b10}.lvl.Expert{background:var(--red);color:#fff}
.clip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;white-space:nowrap;
  box-shadow:0 2px 0 var(--red-dark);transition:transform .12s,box-shadow .12s}
.clip::before{content:"";width:9px;height:11px;clip-path:polygon(0 0,100% 50%,0 100%);background:currentColor}
.clip:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--red-dark)}
.clip:active{transform:translateY(1px);box-shadow:0 1px 0 var(--red-dark)}
.clip:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.corner{position:absolute;right:14px;bottom:8px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;color:#8d7b62}
.stage-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stage .ghost-btn{border-color:var(--sand);color:var(--sand)}
.stage .ghost-btn:hover{background:var(--sand);color:var(--ink)}
.flip-hint{color:#f3e4c0;font-size:14px;opacity:.85;margin:0}
.ghost-card{position:fixed;z-index:30;pointer-events:none;transform-origin:center;will-change:transform}

/* ---------- Language switch ---------- */
.lang{position:fixed;z-index:40;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,253,248,.88);
  box-shadow:0 2px 10px rgba(60,30,0,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lang button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:5px 9px 5px 6px;border-radius:999px;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--muted);
  opacity:.55;filter:grayscale(.7);transition:opacity .15s,filter .15s,background .15s}
.lang button:hover{opacity:.85;filter:none}
.lang button[aria-pressed="true"]{opacity:1;filter:none;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lang button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.lang svg{display:block;width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}

@media (max-width:860px){.deck{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){
  .deck{grid-template-columns:repeat(3,1fr)}
  .qcard{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:0 10px 10px}
  .strip{flex-direction:row;padding:10px 4px 8px;gap:10px}
  .strip .wordmark,.strip .side{writing-mode:horizontal-tb;transform:none}
  .strip .wordmark{font-size:24px}
  .strip .mini{grid-auto-flow:column}
  .panel{padding:8px 12px 10px 6px}
  .row{grid-template-columns:30px 1fr auto;gap:8px;padding:6px 0}
  .clip{padding:8px 10px 8px 11px}
  .clip span{display:none}
  .wedge{width:24px;height:26px}
  .stage{padding:64px 12px 12px;place-items:start center}
}
@media (max-width:420px){.deck{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<template id="back-tpl">
  <span class="card-back" aria-hidden="true"><img class="art" src="stig-helmer.jpg" alt="" draggable="false"><span class="label"><span class="wordmark">Sällskapsresan</span></span></span>
</template>

<div class="lang" role="group" data-i18n-aria="language">
  <button type="button" data-lang="en" aria-pressed="false" lang="en"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="uk-t"><path d="M30,15h30v15zv15H0zH0V0zV0h30z"/></clipPath><path d="M0,0v30h60V0z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#uk-t)" stroke="#c8102e" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#c8102e" stroke-width="6"/></svg>EN</button>
  <button type="button" data-lang="sv" aria-pressed="false" lang="sv"><svg viewBox="0 0 16 10" aria-hidden="true"><rect width="16" height="10" fill="#006aa7"/><rect x="5" width="2" height="10" fill="#fecc00"/><rect y="4" width="16" height="2" fill="#fecc00"/></svg>SV</button>
</div>

<main id="home" class="home">
  <div class="home-inner">
    <div class="sun"><div class="fan" id="fan"></div></div>
    <h1 class="wordmark">Sällskapsresan</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <button class="play" id="play" data-i18n="play"></button>
    <ul class="films" id="film-legend"></ul>
  </div>
</main>

<main id="deck-screen" class="deck-screen" hidden>
  <div class="topbar">
    <button class="wordmark" id="home-link" data-i18n-aria="backToStart">Sällskapsresan</button>
    <div class="actions">
      <button class="ghost-btn" id="reshuffle" data-i18n="reshuffle"></button>
    </div>
  </div>
  <p class="hint" data-i18n="hint"></p>
  <div class="table">
    <div class="pile">
      <button class="pile-slot stack" id="stack"></button>
      <p class="pile-label" id="left-label"></p>
    </div>
    <div class="pile">
      <button class="pile-slot discard" id="discard"></button>
      <p class="pile-label" id="played-label"></p>
    </div>
  </div>
  <div class="done-banner" id="done" hidden>
    <p data-i18n="done"></p>
    <button class="play" id="again" data-i18n="again"></button>
  </div>
</main>

<div class="stage" id="stage" hidden role="dialog" aria-modal="true" data-i18n-aria="dialog">
  <div class="stage-inner">
    <div class="flip" id="flip" role="button" tabindex="0"></div>
    <p class="flip-hint" id="flip-hint"></p>
    <div class="stage-actions">
      <button class="ghost-btn" id="close" data-i18n="close"></button>
      <button class="ghost-btn" id="next" data-i18n="next"></button>
    </div>
  </div>
</div>

<script>

    title: "Sällskapsresan · Family Trivia", tagline: `Family trivia · ${FILMS.length} films · ${QUESTION_COUNT} questions`, play: "Play Sällskapsresan",
    language: "Language", backToStart: "Back to start", reshuffle: "New shuffle",
    hint: "Tap the deck to draw a card. Each card has a question from every film – tap it to turn it over and see the answers.",
    done: "That's the whole deck. Who won?", again: "Shuffle a new deck", dialog: "Trivia card",
    close: "Back to deck", next: "Next card", questions: "Questions", answers: "Answers",
    showAnswers: "Show answers", showQuestions: "Show questions",
    hintAnswers: "Tap the card to see the answers", hintQuestions: "Tap the card to see the questions again",
    left: n => `<strong>${n}</strong> left in the deck`, playedPile: n => `<strong>${n}</strong> played`,
    draw: "Draw a card", lastCard: "Show the last card again", noPlayed: "Played cards go here", deckEmpty: "Deck empty",
    confirmShuffle: "Shuffle a new deck? Played cards will be reset.",
    Easy: "Easy", Medium: "Medium", Hard: "Hard", Expert: "Expert",
    watch: "Watch", watchAria: f => `Watch the scene from ${f} on YouTube`
  },
  sv: {
    title: "Sällskapsresan · Familjefrågesport", tagline: `Familjefrågesport · ${FILMS.length} filmer · ${QUESTION_COUNT} frågor`, play: "Spela Sällskapsresan",
    language: "Språk", backToStart: "Tillbaka till start", reshuffle: "Blanda om",
    hint: "Tryck på kortleken för att dra ett kort. Varje kort har en fråga från varje film – tryck på det för att vända det och se svaren.",
    done: "Det var hela kortleken. Vem vann?", again: "Blanda en ny kortlek", dialog: "Frågekort",
    close: "Tillbaka till korten", next: "Nästa kort", questions: "Frågor", answers: "Svar",
    showAnswers: "Visa svaren", showQuestions: "Visa frågorna",
    hintAnswers: "Tryck på kortet för att se svaren", hintQuestions: "Tryck på kortet för att se frågorna igen",
    left: n => `<strong>${n}</strong> kvar i leken`, playedPile: n => `<strong>${n}</strong> spelade`,
    draw: "Dra ett kort", lastCard: "Visa det senaste kortet igen", noPlayed: "Spelade kort hamnar här", deckEmpty: "Leken är slut",
    confirmShuffle: "Blanda en ny kortlek? Spelade kort nollställs.",
    Easy: "Lätt", Medium: "Medel", Hard: "Svår", Expert: "Expert",
    watch: "Se scenen", watchAria: f => `Se scenen ur ${f} på YouTube`
  }
};
function initialLang(){
  try{ const s = localStorage.getItem(LANG_STORE); if(s in I18N) return s; }catch{}
  return (navigator.language || "").toLowerCase().startsWith("sv") ? "sv" : "en";
}
let lang = initialLang();
const t = k => I18N[lang][k];

const $ = id => document.getElementById(id);
const backTpl = $("back-tpl");
const makeBack = () => backTpl.content.firstElementChild.cloneNode(true);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* Resolve when an animation ends, or after its duration if the browser pauses it (e.g. background tab). */
const settle = a => Promise.race([a.finished, new Promise(r => setTimeout(r, a.effect.getTiming().duration + 120))]);

/* Every card holds one question per film; each question is used exactly once.
   Each film's questions are ordered easy→expert (shuffled within a level), and the films
   read that order at evenly spread offsets, so every card mixes easy, medium and hard. */
function newGame(){
  const n = Math.min(...FILMS.map(f => f.questions.length));
  const orders = FILMS.map(f => shuffle(f.questions.map((_, qi) => qi))
    .sort((a, b) => LVL_RANK[f.questions[a].lvl] - LVL_RANK[f.questions[b].lvl]));
  const offsets = shuffle(FILMS.map((_, m) => Math.round(m * n / FILMS.length)));
  const cards = Array.from({length: n}, (_, c) => FILMS.map((_, m) => [m, orders[m][(c + offsets[m]) % n]]));
  return {sig: SIG, cards: shuffle(cards), played: []};
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE));
    if(s && s.sig === SIG && Array.isArray(s.cards) && Array.isArray(s.played)) return s;
  }catch{}
  return newGame();
}
let game = load();
const save = () => { try{ localStorage.setItem(STORE, JSON.stringify(game)) }catch{} };
save();

/* ---------- Home ---------- */
for(let i=0;i<3;i++) $("fan").append(makeBack());
$("film-legend").innerHTML = FILMS.map(f => `<li><i class="tri" style="--c:var(--c-${f.color})"></i>${f.short}</li>`).join("");

function show(screen){
  $("home").hidden = screen !== "home";
  $("deck-screen").hidden = screen !== "deck";
  if(screen === "deck") renderDeck();
  window.scrollTo(0,0);
}
$("play").onclick = () => { history.pushState({s:"deck"}, "", "#play"); show("deck"); };
$("home-link").onclick = () => { history.pushState({s:"home"}, "", location.pathname); show("home"); };
addEventListener("popstate", () => { closeStage(true); show(location.hash === "#play" ? "deck" : "home"); });

/* ---------- Deck: a draw pile and a discard pile ---------- */
let inHand = null;  // card currently shown on the stage; kept off the discard pile until it is put back
const nextUndrawn = () => game.cards.findIndex((_, i) => !game.played.includes(i));
const pose = i => ({x: (i * 13) % 11 - 5, y: (i * 7) % 9 - 4, r: (i * 47) % 19 - 9});
function renderDeck(){
  const left = game.cards.length - game.played.length;
  const stack = $("stack"), discard = $("discard");
  stack.replaceChildren(); discard.replaceChildren();
  const layers = left ? Math.min(12, Math.ceil(left / 8)) : 0;
  for(let k = layers - 1; k >= 0; k--){
    const b = makeBack();
    b.style.setProperty("--k", k);
    if(k === layers - 1) b.classList.add("bottom");
    if(k === 0) b.classList.add("top");
    stack.append(b);
  }
  if(!left) stack.insertAdjacentHTML("beforeend", `<span class="empty-slot">${t("deckEmpty")}</span>`);
  stack.disabled = !left;
  const shown = game.played.filter(i => i !== inHand).slice(-5);
  for(const i of shown){
    const b = makeBack(), p = pose(i);
    b.style.setProperty("--x", p.x + "px"); b.style.setProperty("--y", p.y + "px"); b.style.setProperty("--rot", p.r + "deg");
    discard.append(b);
  }
  if(!shown.length) discard.insertAdjacentHTML("beforeend", `<span class="empty-slot">${t("noPlayed")}</span>`);
  discard.disabled = !shown.length;
  updateStatus();
}
function updateStatus(){
  const n = game.played.length, left = game.cards.length - n;
  $("left-label").innerHTML = t("left")(left);
  $("played-label").innerHTML = t("playedPile")(n);
  $("stack").setAttribute("aria-label", t("draw"));
  $("discard").setAttribute("aria-label", t("lastCard"));
  $("done").hidden = left > 0;
}
$("stack").onclick = () => { const i = nextUndrawn(); if(i >= 0) openCard(i, $("stack").querySelector(".top")); };
$("discard").onclick = () => { const i = game.played.at(-1); if(i != null) openCard(i, $("discard").lastElementChild); };
function reshuffle(){
  if(game.played.length && game.played.length < game.cards.length && !confirm(t("confirmShuffle"))) return;
  game = newGame(); save(); renderDeck();
}
$("reshuffle").onclick = reshuffle;
$("again").onclick = reshuffle;

/* ---------- Question card ---------- */
let current = -1;
function face(cardIdx, side){
  const rows = game.cards[cardIdx].map(([m, qi]) => {
    const f = FILMS[m], q = f.questions[qi], lvl = q.lvl;
    const clip = side === "a" && f.video && q.t != null
      ? `<a class="clip" href="https://www.youtube.com/watch?v=${f.video}&amp;t=${q.t}s" target="_blank" rel="noopener" aria-label="${t("watchAria")(f.short)}"><span>${t("watch")}</span></a>` : "";
    return `<div class="row"><i class="wedge" style="--c:var(--c-${f.color})"></i>
      <div><div class="txt">${side === "q" ? q.q[lang] : q.a[lang]}</div>
      <span class="meta">${f.short} · ${f.year}<span class="lvl ${lvl}">${t(lvl)}</span></span></div>${clip}</div>`;
  }).join("");
  return `<div class="face ${side === "q" ? "questions" : "answers"}"><div class="qcard">
    <div class="strip"><span class="wordmark">Sällskapsresan</span>
      <span class="mini">${FILMS.map(f => `<i style="--c:var(--c-${f.color})"></i>`).join("")}</span>
      <span class="side">${t(side === "q" ? "questions" : "answers")}</span></div>
    <div class="panel">${rows}<span class="corner">${cardIdx+1}</span></div>
  </div></div>`;
}
function setFlipped(on){
  $("flip").classList.toggle("flipped", on);
  $("flip").setAttribute("aria-label", t(on ? "showQuestions" : "showAnswers"));
  $("flip-hint").textContent = t(on ? "hintQuestions" : "hintAnswers");
  const q = $("flip").querySelector(".face.questions"), a = $("flip").querySelector(".face.answers");
  if(q){ q.inert = on; a.inert = !on; }
}
async function openCard(i, fromEl){
  current = i;
  const flip = $("flip"), stage = $("stage");
  flip.innerHTML = `<div class="flip-inner">${face(i,"q")}${face(i,"a")}</div>`;
  inHand = i;
  setFlipped(false);
  stage.classList.remove("closing");
  stage.hidden = false;
  stage.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if(!game.played.includes(i)){ game.played.push(i); save(); }
  $("next").hidden = game.played.length >= game.cards.length;

  if(fromEl && !reduceMotion.matches){
    const from = fromEl.getBoundingClientRect();
    const to = flip.getBoundingClientRect();
    const ghost = makeBack(); ghost.classList.add("ghost-card");
    Object.assign(ghost.style, {left: from.left+"px", top: from.top+"px", width: from.width+"px", height: from.height+"px"});
    document.body.append(ghost);
    fromEl.classList.add("lifting");
    flip.style.visibility = "hidden";
    const dx = to.left + to.width/2 - (from.left + from.width/2);
    const dy = to.top + Math.min(to.height, innerHeight - to.top)/2 - (from.top + from.height/2);
    const s = Math.min(to.height, innerHeight*.8) / from.height;
    await settle(ghost.animate([
      {transform:"perspective(1400px) translate(0,0) scale(1) rotateY(0deg)"},
      {transform:`perspective(1400px) translate(${dx}px,${dy}px) scale(${s}) rotateY(90deg)`}
    ], {duration:520, easing:"cubic-bezier(.3,.6,.4,1)", fill:"forwards"}));
    ghost.remove();
    renderDeck();
    flip.style.visibility = "";
    await settle(flip.animate([
      {transform:"perspective(1800px) rotateY(-90deg)"},
      {transform:"perspective(1800px) rotateY(0)"}
    ], {duration:380, easing:"cubic-bezier(.2,.8,.3,1)"}));
  } else renderDeck();
  flip.focus({preventScroll:true});
  updateStatus();
}
function closeStage(instant){
  const stage = $("stage");
  if(stage.hidden || (stage.classList.contains("closing") && !instant)) return;
  const done = () => {
    stage.hidden = true; stage.classList.remove("closing"); document.body.style.overflow = "";
    inHand = null;
    renderDeck();
    $(nextUndrawn() >= 0 ? "stack" : "discard").focus({preventScroll:true});
  };
  if(instant || reduceMotion.matches) return done();
  stage.classList.add("closing");
  // put the card back face down onto the discard pile
  const from = $("flip").getBoundingClientRect(), to = $("discard").getBoundingClientRect(), p = pose(current);
  const ghost = makeBack(); ghost.classList.add("ghost-card");
  Object.assign(ghost.style, {left: to.left+"px", top: to.top+"px", width: to.width+"px", height: to.height+"px"});
  document.body.append(ghost);
  const dx = from.left + from.width/2 - (to.left + to.width/2);
  const dy = from.top + Math.min(from.height, innerHeight - from.top)/2 - (to.top + to.height/2);
  settle(ghost.animate([
    {transform:`translate(${dx}px,${dy}px) scale(1.15)`, opacity:0},
    {transform:`translate(${dx*.85}px,${dy*.85}px) scale(1.12)`, opacity:1, offset:.2},
    {transform:`translate(${p.x}px,${p.y}px) rotate(${p.r}deg)`, opacity:1}
  ], {duration:480, easing:"cubic-bezier(.4,.1,.3,1)", fill:"forwards"})).then(() => { done(); ghost.remove(); });
}
function nextCard(){
  const i = nextUndrawn();
  if(i < 0) return closeStage();
  const flip = $("flip");
  settle(flip.animate([{transform:"translateX(0)",opacity:1},{transform:"translateX(-60px)",opacity:0}], {duration:reduceMotion.matches?1:220, easing:"ease-in"}))
    .then(() => { openCard(i, null); flip.animate([{transform:"translateX(60px)",opacity:0},{transform:"none",opacity:1}], {duration:reduceMotion.matches?1:260, easing:"ease-out"}); });
}
const toggleFlip = () => setFlipped(!$("flip").classList.contains("flipped"));
$("flip").addEventListener("click", e => { if(!e.target.closest("a")) toggleFlip(); });
$("flip").addEventListener("keydown", e => {
  if(e.target !== e.currentTarget || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault(); toggleFlip();
});
$("close").onclick = () => closeStage();
$("next").onclick = nextCard;
$("stage").addEventListener("click", e => { if(e.target === e.currentTarget) closeStage(); });
addEventListener("keydown", e => { if(e.key === "Escape") closeStage(); });

/* ---------- Language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  renderDeck();
  if(!$("stage").hidden && current >= 0){
    const flipped = $("flip").classList.contains("flipped");
    $("flip").querySelector(".flip-inner").innerHTML = face(current,"q") + face(current,"a");
    setFlipped(flipped);
  }
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try{ localStorage.setItem(LANG_STORE, lang) }catch{}
  applyLang();
});

applyLang();
show(location.hash === "#play" ? "deck" : "home");
</script>
</body>
</html>
